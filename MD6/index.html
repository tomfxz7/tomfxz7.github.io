<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebApp Hub</title>
  
  <!-- PWA & App Icons -->
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./favicon.ico">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* アニメーション */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-fade-in { animation: fadeIn 0.15s ease-out forwards; }
    .animate-zoom-in { animation: zoomIn 0.2s ease-out forwards; }
    
    /* スクロールバー */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* アクティブなタブ */
    .tab-active {
      background-color: #f1f5f9;
      color: #4f46e5;
      border-bottom: 2px solid #4f46e5;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* ロゴのホバー効果 */
    .logo-container:hover .logo-icon {
      transform: scale(1.1);
      background-color: #e0e7ff;
    }
  </style>
</head>
<body class="bg-slate-100/50 text-slate-800 font-sans selection:bg-indigo-100 min-h-screen flex flex-col overflow-hidden">

  <!-- ====================
       ヘッダーとタブバー
  ==================== -->
  <header class="bg-white border-b border-slate-200 z-50 shadow-sm shrink-0">
    <div class="max-w-[1800px] mx-auto flex items-center h-14 px-4 gap-4">
      <!-- ロゴ (ホームボタンとして機能) -->
      <div id="logo-home" class="flex items-center gap-2 text-indigo-600 shrink-0 mr-2 cursor-pointer logo-container group transition-all" onclick="switchTab('home')">
        <div class="bg-indigo-100 p-1.5 rounded-lg logo-icon transition-transform duration-200">
          <i data-lucide="box" class="w-5 h-5" stroke-width="2.5"></i>
        </div>
        <h1 class="text-lg font-bold tracking-tight hidden lg:block group-hover:text-indigo-700 transition-colors">WebApp Hub</h1>
      </div>

      <!-- タブコンテナ -->
      <nav id="tab-container" class="flex-1 flex items-center h-full overflow-x-auto no-scrollbar gap-1">
        <!-- JSでタブが挿入されます -->
      </nav>

      <!-- 右側アクション -->
      <div id="global-actions" class="flex items-center gap-1 shrink-0 border-l border-slate-200 pl-4">
        <div id="runner-tools" class="hidden flex items-center gap-1">
          <button id="btn-reload-runner" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500 transition-colors" title="再読み込み (F5)">
            <i data-lucide="rotate-cw" class="w-4 h-4"></i>
          </button>
        </div>
        
        <div id="home-tools" class="flex items-center gap-2">
          <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg px-2">
            <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-slate-400 mr-1"></i>
            <select id="sort-select" class="bg-transparent text-xs text-slate-600 py-2 focus:outline-none cursor-pointer">
              <option value="date-asc">登録日 (旧)</option>
              <option value="date-desc">登録日 (新)</option>
              <option value="name-asc">名前 (昇順)</option>
              <option value="name-desc">名前 (降順)</option>
            </select>
          </div>
          <button id="btn-import" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500" title="インポート">
            <i data-lucide="download" class="w-4 h-4"></i>
          </button>
          <button id="btn-export" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500" title="エクスポート">
            <i data-lucide="upload" class="w-4 h-4"></i>
          </button>
          <input type="file" accept=".json" id="import-file-input" class="hidden" />
        </div>

        <!-- 設定ボタン -->
        <button id="btn-settings" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500 ml-1" title="設定">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ====================
       メインコンテンツエリア
  ==================== -->
  <main class="flex-1 relative overflow-hidden bg-slate-50/30">
    
    <!-- グリッド表示（ホーム） -->
    <div id="main-view" class="absolute inset-0 overflow-y-auto p-6 md:p-10 z-10 transition-opacity duration-200">
      <div class="max-w-[1600px] mx-auto">
        <div id="app-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4 sm:gap-6">
          <!-- アプリタイル -->
        </div>
      </div>
    </div>

    <!-- 実行画面（Iframe管理） -->
    <div id="runner-view" class="absolute inset-0 z-20 hidden flex-col bg-white">
      <div id="iframe-manager" class="flex-1 w-full relative">
        <!-- タブごとのiframe -->
      </div>
    </div>
  </main>


  <!-- ====================
       モーダル群
  ==================== -->
  
  <!-- エディタモーダル -->
  <div id="editor-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] items-center justify-center p-4 hidden animate-fade-in">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl h-[90vh] flex flex-col overflow-hidden animate-zoom-in">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80 shrink-0">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-3">
          <div class="bg-indigo-100 p-1.5 rounded-lg text-indigo-600">
            <i data-lucide="code" class="w-5 h-5"></i>
          </div>
          <span id="editor-title">新規アプリを登録</span>
        </h2>
        <button id="btn-close-editor" class="p-2 text-slate-400 hover:bg-slate-200 rounded-full transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div class="p-6 flex-1 overflow-y-auto bg-slate-50 flex flex-col gap-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-4">
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">アプリ名</label>
              <input type="text" id="editor-name" placeholder="例: メモ帳" class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500/50 outline-none transition-all" />
            </div>
            <div>
              <label class="block text-sm font-semibold text-slate-700 mb-2">アイコン画像</label>
              <div class="flex gap-4 items-start">
                <div id="editor-image-preview" class="w-20 h-20 shrink-0 rounded-2xl bg-white border border-slate-200 overflow-hidden flex items-center justify-center shadow-inner text-slate-300">
                  <i data-lucide="image" class="w-8 h-8"></i>
                </div>
                <div class="flex-1 flex flex-col gap-2">
                  <input type="text" id="editor-image-url" placeholder="URLを入力、または画像をコピペ..." class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500/50" />
                  <div class="flex items-center gap-2">
                    <button id="btn-trigger-file" class="text-xs font-medium bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg">ファイル選択</button>
                    <button id="btn-clear-image" class="text-xs font-medium text-red-500 hover:bg-red-50 px-3 py-1.5 rounded-lg hidden">クリア</button>
                    <input type="file" accept="image/*" id="editor-image-file" class="hidden" />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="flex flex-col">
            <label class="block text-sm font-semibold text-slate-700 mb-2">HTMLコード</label>
            <textarea id="editor-html" class="w-full flex-1 min-h-[300px] font-mono text-sm px-4 py-4 bg-slate-900 text-slate-100 border border-slate-300 rounded-xl focus:outline-none resize-none leading-relaxed" spellcheck="false"></textarea>
          </div>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-slate-100 bg-white flex justify-end gap-3 shrink-0">
        <button id="btn-cancel-editor" class="px-6 py-2.5 text-slate-600 hover:bg-slate-100 border rounded-xl font-medium">キャンセル</button>
        <button id="btn-save-editor" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 shadow-lg shadow-indigo-200">保存して登録</button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[130] items-center justify-center p-4 hidden animate-fade-in">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md flex flex-col overflow-hidden animate-zoom-in">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80 shrink-0">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-3">
          <i data-lucide="settings" class="w-5 h-5 text-slate-500"></i>
          <span>設定</span>
        </h2>
        <button id="btn-close-settings" class="p-2 text-slate-400 hover:bg-slate-200 rounded-full transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div class="p-6 flex flex-col gap-6">
        <!-- タブ表示モード -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-3">タブの表示モード</label>
          <div class="flex bg-slate-100 p-1 rounded-xl">
            <button id="tab-mode-full" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all">名前とアイコン</button>
            <button id="tab-mode-icon" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all">アイコンのみ</button>
          </div>
        </div>

        <hr class="border-slate-100">

        <!-- 情報 -->
        <div class="bg-slate-50 p-4 rounded-2xl flex flex-col gap-1">
          <div class="flex justify-between text-sm">
            <span class="text-slate-500">バージョン</span>
            <span class="font-mono text-slate-800">1.2.3</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-slate-500">開発者</span>
            <span class="font-semibold text-indigo-600">tomfxz7</span>
          </div>
        </div>
      </div>
      <div class="px-6 py-4 bg-slate-50 flex justify-end">
        <button id="btn-confirm-settings" class="px-6 py-2 bg-slate-900 text-white rounded-xl font-medium">閉じる</button>
      </div>
    </div>
  </div>

  <!-- インポート確認モーダル -->
  <div id="import-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[110] items-center justify-center p-4 hidden animate-fade-in">
    <div class="bg-white p-6 rounded-3xl shadow-xl max-w-md w-full animate-zoom-in">
      <h3 class="text-xl font-bold text-slate-800 mb-2">インポート方法</h3>
      <p id="import-msg" class="text-slate-600 text-sm mb-6"></p>
      <div class="flex flex-col gap-3">
        <button id="btn-import-append" class="w-full text-left p-4 rounded-xl border hover:border-indigo-400 hover:bg-indigo-50 transition-colors">
          <div class="font-semibold">既存のリストに追加</div>
          <div class="text-xs text-slate-500">現在のアプリを残したまま追加します。</div>
        </button>
        <button id="btn-import-overwrite" class="w-full text-left p-4 rounded-xl border hover:border-red-400 hover:bg-red-50 transition-colors">
          <div class="font-semibold text-red-600">全て上書き</div>
          <div class="text-xs text-slate-500">現在のリストを消去して置き換えます。</div>
        </button>
        <button id="btn-import-cancel" class="w-full mt-2 p-3 text-slate-500 hover:bg-slate-100 rounded-xl transition-colors">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 確認モーダル -->
  <div id="confirm-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[120] items-center justify-center p-4 hidden animate-fade-in">
    <div class="bg-white p-6 rounded-3xl shadow-xl max-w-sm w-full animate-zoom-in">
      <h3 id="confirm-title" class="text-lg font-bold text-slate-800 mb-2"></h3>
      <p id="confirm-msg" class="text-slate-600 text-sm mb-6"></p>
      <div class="flex gap-3 justify-end">
        <button id="btn-confirm-cancel" class="px-4 py-2 text-slate-600 bg-slate-100 rounded-lg">キャンセル</button>
        <button id="btn-confirm-ok" class="px-4 py-2 bg-red-600 text-white rounded-lg">削除する</button>
      </div>
    </div>
  </div>

  <!-- D&Dオーバーレイ -->
  <div id="drop-overlay" class="fixed inset-0 bg-indigo-600/90 z-[200] hidden flex-col items-center justify-center text-white border-8 border-indigo-300 border-dashed m-4 rounded-3xl pointer-events-none transition-opacity duration-200">
    <i data-lucide="file-code" class="w-20 h-20 mb-4"></i>
    <h2 class="text-3xl font-bold">ファイルをドロップ</h2>
    <p class="mt-2 text-indigo-100 font-medium">複数のHTMLを一気に追加できます</p>
  </div>

  <!-- ====================
       JavaScript ロジック
  ==================== -->
  <script>
    // --- 状態管理 ---
    let apps = [];
    let openAppIds = []; 
    let activeTabId = 'home';
    let sortOption = 'date-asc';
    let currentEditingAppId = null;
    let currentImageUrl = '';
    let importPendingData = null;
    let confirmCallback = null;
    
    // 設定
    let tabDisplayMode = 'full'; 

    // --- DOM要素 ---
    const gridContainer = document.getElementById('app-grid');
    const tabContainer = document.getElementById('tab-container');
    const iframeManager = document.getElementById('iframe-manager');
    const mainView = document.getElementById('main-view');
    const runnerView = document.getElementById('runner-view');
    const sortSelect = document.getElementById('sort-select');
    const editorModal = document.getElementById('editor-modal');
    const settingsModal = document.getElementById('settings-modal');
    const homeTools = document.getElementById('home-tools');
    const runnerTools = document.getElementById('runner-tools');

    // --- モーダル制御ヘルパー ---
    const openModal = (modal) => {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };
    const closeModal = (modal) => {
      modal.classList.remove('flex');
      modal.classList.add('hidden');
    };

    // --- ユーティリティ ---
    const generateId = () => {
      try { return crypto.randomUUID(); } catch(e) { 
        return 'id-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9); 
      }
    };
    const escapeHTML = (str) => {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag] || tag));
    };
    
    const getColorFromName = (name) => {
      const colors = ['from-red-400 to-rose-600', 'from-orange-400 to-red-500', 'from-amber-400 to-orange-500', 'from-emerald-400 to-teal-600', 'from-cyan-400 to-blue-600', 'from-blue-500 to-indigo-600', 'from-violet-500 to-purple-600', 'from-fuchsia-400 to-pink-600'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    };

    // --- 初期化 ---
    function init() {
      const savedData = localStorage.getItem('webapp_hub_data');
      if (savedData) {
        try { apps = JSON.parse(savedData); } catch (e) { console.error('Data error'); }
      }
      const savedSort = localStorage.getItem('webapp_hub_sort');
      if (savedSort) {
        sortOption = savedSort;
        sortSelect.value = sortOption;
      }
      const savedSettings = localStorage.getItem('webapp_hub_settings');
      if (savedSettings) {
        try {
          const config = JSON.parse(savedSettings);
          tabDisplayMode = config.tabDisplayMode || 'full';
        } catch(e) {}
      }

      renderGrid();
      renderTabs();
      updateView();
      updateSettingsUI();
      lucide.createIcons();
    }

    function saveData() {
      localStorage.setItem('webapp_hub_data', JSON.stringify(apps));
      localStorage.setItem('webapp_hub_sort', sortOption);
      localStorage.setItem('webapp_hub_settings', JSON.stringify({ tabDisplayMode }));
    }

    // --- レンダリング系 ---
    function renderGrid() {
      const sortedApps = [...apps].sort((a, b) => {
        if (sortOption === 'name-asc') return a.name.localeCompare(b.name, 'ja');
        if (sortOption === 'name-desc') return b.name.localeCompare(a.name, 'ja');
        if (sortOption === 'date-asc') return (a.createdAt || 0) - (b.createdAt || 0);
        if (sortOption === 'date-desc') return (b.createdAt || 0) - (a.createdAt || 0);
        return 0;
      });

      gridContainer.innerHTML = '';

      const addBtn = document.createElement('button');
      addBtn.className = "aspect-square flex flex-col items-center justify-center gap-4 rounded-3xl bg-white border-2 border-dashed border-slate-200 text-slate-400 hover:border-indigo-400 hover:text-indigo-600 transition-all group shadow-sm";
      addBtn.onclick = () => openEditor();
      addBtn.innerHTML = `
        <div class="w-14 h-14 rounded-2xl bg-slate-50 flex items-center justify-center group-hover:bg-indigo-50 group-hover:scale-110 transition-all duration-300">
          <i data-lucide="plus" class="w-8 h-8" stroke-width="2.5"></i>
        </div>
        <span class="font-bold text-xs uppercase tracking-widest">アプリを追加</span>
      `;
      gridContainer.appendChild(addBtn);

      sortedApps.forEach(app => {
        const tile = document.createElement('div');
        tile.className = "aspect-square relative group rounded-3xl bg-white shadow-sm hover:shadow-xl border border-slate-100 transition-all duration-300 cursor-pointer flex flex-col items-center justify-center p-4 hover:-translate-y-1";
        tile.onclick = () => switchTab(app.id);

        let iconContent = app.imageUrl 
          ? `<img src="${escapeHTML(app.imageUrl)}" class="w-full h-full object-cover" />` 
          : app.name.substring(0, 2).toUpperCase();
        const bgClass = app.imageUrl ? 'bg-slate-50' : `bg-gradient-to-br ${getColorFromName(app.name)} text-white`;

        tile.innerHTML = `
          <div class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity z-10">
            <button class="btn-edit p-1.5 bg-white/90 rounded-xl text-slate-500 hover:text-blue-600 border border-slate-100 shadow-sm"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
            <button class="btn-delete p-1.5 bg-white/90 rounded-xl text-slate-500 hover:text-red-600 border border-slate-100 shadow-sm"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl ${bgClass} flex items-center justify-center text-2xl font-bold shadow-lg mb-3 ring-4 ring-white overflow-hidden group-hover:scale-105 transition-transform">
            ${iconContent}
          </div>
          <h3 class="font-bold text-slate-800 text-center w-full truncate px-2 text-xs sm:text-sm">${escapeHTML(app.name)}</h3>
        `;

        tile.querySelector('.btn-edit').onclick = (e) => { e.stopPropagation(); openEditor(app); };
        tile.querySelector('.btn-delete').onclick = (e) => { e.stopPropagation(); requestDelete(app); };

        gridContainer.appendChild(tile);
      });
      lucide.createIcons({ root: gridContainer });
    }

    function renderTabs() {
      tabContainer.innerHTML = '';

      openAppIds.forEach(id => {
        const app = apps.find(a => a.id === id);
        if (!app) return;

        const tab = document.createElement('button');
        const isActive = activeTabId === id;
        tab.className = `group flex items-center gap-2 h-full font-bold text-sm transition-all shrink-0 border-x border-slate-100 ${isActive ? 'tab-active' : 'text-slate-400 hover:bg-slate-50'} ${tabDisplayMode === 'icon-only' ? 'px-2' : 'pl-4 pr-2'}`;
        tab.onclick = () => switchTab(id);
        tab.onmousedown = (e) => { if(e.button === 1) { e.preventDefault(); closeTab(id); } }; 

        if (tabDisplayMode === 'icon-only') {
          let iconInner = '';
          if (app.imageUrl) {
            iconInner = `<img src="${escapeHTML(app.imageUrl)}" class="w-6 h-6 rounded-md object-cover border border-slate-200" />`;
          } else {
            iconInner = `<div class="w-6 h-6 rounded-md bg-gradient-to-br ${getColorFromName(app.name)} text-white flex items-center justify-center text-[10px] shadow-sm">${app.name.substring(0, 1).toUpperCase()}</div>`;
          }
          tab.innerHTML = `
            <div class="flex items-center gap-1">
              ${iconInner}
              <div class="btn-close-tab p-1 rounded-md hover:bg-slate-200 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
                <i data-lucide="x" class="w-3 h-3"></i>
              </div>
            </div>
          `;
        } else {
          tab.innerHTML = `
            <span class="truncate max-w-[120px]">${escapeHTML(app.name)}</span>
            <div class="btn-close-tab p-1 rounded-md hover:bg-slate-200 text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">
              <i data-lucide="x" class="w-3 h-3"></i>
            </div>
          `;
        }
        
        tab.querySelector('.btn-close-tab').onclick = (e) => { e.stopPropagation(); closeTab(id); };
        tabContainer.appendChild(tab);
      });
      lucide.createIcons({ root: tabContainer });
    }

    function updateView() {
      if (activeTabId === 'home') {
        mainView.style.display = 'block';
        runnerView.style.display = 'none';
        homeTools.classList.remove('hidden');
        runnerTools.classList.add('hidden');
      } else {
        mainView.style.display = 'none';
        runnerView.style.display = 'flex';
        homeTools.classList.add('hidden');
        runnerTools.classList.remove('hidden');
        
        Array.from(iframeManager.children).forEach(iframe => {
          iframe.classList.toggle('hidden', iframe.id !== `iframe-${activeTabId}`);
        });
      }
    }

    // --- タブ・Iframe管理 ---
    function switchTab(id) {
      if (id !== 'home' && !openAppIds.includes(id)) {
        const app = apps.find(a => a.id === id);
        if (!app) return;
        
        openAppIds.push(id);
        const iframe = document.createElement('iframe');
        iframe.id = `iframe-${id}`;
        iframe.className = "absolute inset-0 w-full h-full border-none hidden";
        iframe.sandbox = "allow-scripts allow-forms allow-modals allow-downloads allow-same-origin";
        iframe.srcdoc = injectStorageShim(id, app.html);
        iframeManager.appendChild(iframe);
      }

      activeTabId = id;
      renderTabs();
      updateView();
    }

    function closeTab(id) {
      openAppIds = openAppIds.filter(oid => oid !== id);
      const iframe = document.getElementById(`iframe-${id}`);
      if (iframe) iframe.remove();

      if (activeTabId === id) {
        activeTabId = openAppIds.length > 0 ? openAppIds[openAppIds.length-1] : 'home';
      }
      renderTabs();
      updateView();
    }

    function reloadActiveApp() {
      if (activeTabId === 'home') return;
      const app = apps.find(a => a.id === activeTabId);
      const iframe = document.getElementById(`iframe-${activeTabId}`);
      if (app && iframe) {
        iframe.srcdoc = '';
        setTimeout(() => { iframe.srcdoc = injectStorageShim(app.id, app.html); }, 50);
      }
    }

    function injectStorageShim(appId, html) {
      return `<script>
        (function() {
          const appId = "${appId}";
          const prefix = "webapp_hub_scoped_" + appId + "_";
          const originalLS = window.localStorage;
          const scopedLS = {
            getItem: (key) => originalLS.getItem(prefix + key),
            setItem: (key, val) => originalLS.setItem(prefix + key, val),
            removeItem: (key) => originalLS.removeItem(prefix + key),
            clear: () => { Object.keys(originalLS).forEach(k => { if(k.startsWith(prefix)) originalLS.removeItem(k); }); },
            key: (i) => {
              const keys = Object.keys(originalLS).filter(k => k.startsWith(prefix));
              return keys[i] ? keys[i].replace(prefix, '') : null;
            },
            get length() { return Object.keys(originalLS).filter(k => k.startsWith(prefix)).length; }
          };
          Object.defineProperty(window, 'localStorage', { get: () => scopedLS, configurable: true });
        })();
      <\/script>` + html;
    }

    // --- エディタ関連 ---
    const nameInput = document.getElementById('editor-name');
    const htmlInput = document.getElementById('editor-html');
    const urlInput = document.getElementById('editor-image-url');
    const previewArea = document.getElementById('editor-image-preview');

    function openEditor(app = null) {
      currentEditingAppId = app?.id || null;
      nameInput.value = app?.name || '';
      htmlInput.value = app?.html || '<!DOCTYPE html><html><head><style>body{font-family:sans-serif;display:grid;place-items:center;height:100vh;margin:0;}</style></head><body><h1>Hello World</h1></body></html>';
      currentImageUrl = app?.imageUrl || '';
      urlInput.value = currentImageUrl;
      
      document.getElementById('editor-title').textContent = app ? 'アプリを編集' : '新規アプリを登録';
      updateImagePreviewUI();
      openModal(editorModal);
    }

    function updateImagePreviewUI() {
      const clearBtn = document.getElementById('btn-clear-image');
      if (currentImageUrl) {
        previewArea.innerHTML = `<img src="${escapeHTML(currentImageUrl)}" class="w-full h-full object-cover" />`;
        clearBtn.classList.remove('hidden');
      } else {
        previewArea.innerHTML = `<i data-lucide="image" class="w-8 h-8"></i>`;
        clearBtn.classList.add('hidden');
      }
      lucide.createIcons({ root: previewArea });
    }

    document.getElementById('btn-save-editor').onclick = () => {
      const name = nameInput.value.trim();
      const html = htmlInput.value.trim();
      if (!name || !html) return;

      if (currentEditingAppId) {
        apps = apps.map(a => a.id === currentEditingAppId ? { ...a, name, html, imageUrl: currentImageUrl } : a);
        const iframe = document.getElementById(`iframe-${currentEditingAppId}`);
        if (iframe) iframe.srcdoc = injectStorageShim(currentEditingAppId, html);
      } else {
        apps.push({ id: generateId(), name, html, imageUrl: currentImageUrl, createdAt: Date.now() });
      }
      saveData();
      renderGrid();
      closeModal(editorModal);
    };

    function processImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max = 200;
          let w = img.width, h = img.height;
          if (w > h) { if (w > max) { h *= max/w; w = max; } } else { if (h > max) { w *= max/h; h = max; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          currentImageUrl = canvas.toDataURL('image/webp', 0.8);
          urlInput.value = "添付画像 (リサイズ済)";
          updateImagePreviewUI();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('btn-trigger-file').onclick = () => document.getElementById('editor-image-file').click();
    document.getElementById('editor-image-file').onchange = (e) => { if(e.target.files[0]) processImage(e.target.files[0]); };
    document.getElementById('btn-clear-image').onclick = () => { currentImageUrl = ''; urlInput.value = ''; updateImagePreviewUI(); };
    urlInput.oninput = (e) => { currentImageUrl = e.target.value; updateImagePreviewUI(); };
    editorModal.onpaste = (e) => {
      const item = Array.from(e.clipboardData.items).find(i => i.type.startsWith('image/'));
      if (item) { processImage(item.getAsFile()); e.preventDefault(); }
    };

    // --- 設定関連 ---
    function openSettings() {
      openModal(settingsModal);
      updateSettingsUI();
    }
    
    function updateSettingsUI() {
      const btnFull = document.getElementById('tab-mode-full');
      const btnIcon = document.getElementById('tab-mode-icon');
      
      const activeClass = "bg-white text-indigo-600 shadow-sm";
      const inactiveClass = "text-slate-500 hover:text-slate-700";
      
      btnFull.className = `flex-1 py-2 text-sm font-medium rounded-lg transition-all ${tabDisplayMode === 'full' ? activeClass : inactiveClass}`;
      btnIcon.className = `flex-1 py-2 text-sm font-medium rounded-lg transition-all ${tabDisplayMode === 'icon-only' ? activeClass : inactiveClass}`;
    }

    document.getElementById('tab-mode-full').onclick = () => { tabDisplayMode = 'full'; updateSettingsUI(); saveData(); renderTabs(); };
    document.getElementById('tab-mode-icon').onclick = () => { tabDisplayMode = 'icon-only'; updateSettingsUI(); saveData(); renderTabs(); };
    
    // イベントリスナー
    document.getElementById('btn-settings').onclick = openSettings;
    document.getElementById('btn-close-settings').onclick = () => closeModal(settingsModal);
    document.getElementById('btn-confirm-settings').onclick = () => closeModal(settingsModal);

    // --- モーダル・確認関連 ---
    document.getElementById('btn-reload-runner').onclick = reloadActiveApp;
    document.getElementById('btn-close-editor').onclick = () => closeModal(editorModal);
    document.getElementById('btn-cancel-editor').onclick = () => closeModal(editorModal);
    sortSelect.onchange = (e) => { sortOption = e.target.value; saveData(); renderGrid(); };

    function requestDelete(app) {
      document.getElementById('confirm-title').textContent = 'アプリの削除';
      document.getElementById('confirm-msg').textContent = `「${app.name}」を削除しますか？`;
      confirmCallback = () => {
        apps = apps.filter(a => a.id !== app.id);
        closeTab(app.id);
        saveData();
        renderGrid();
      };
      openModal(document.getElementById('confirm-modal'));
    }
    document.getElementById('btn-confirm-ok').onclick = () => { confirmCallback?.(); closeModal(document.getElementById('confirm-modal')); };
    document.getElementById('btn-confirm-cancel').onclick = () => closeModal(document.getElementById('confirm-modal'));

    // ドラッグ＆ドロップ
    const dropOverlay = document.getElementById('drop-overlay');
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      // アプリ実行中（ホーム以外のタブが開いている時）は反応させない
      if (activeTabId !== 'home') return; 
      e.preventDefault();
      if (e.dataTransfer.types.includes('Files')) {
        dragCounter++;
        dropOverlay.classList.remove('hidden');
        dropOverlay.classList.add('flex');
      }
    });

    window.addEventListener('dragover', (e) => {
      if (activeTabId !== 'home') return;
      e.preventDefault();
    });

    window.addEventListener('dragleave', (e) => {
      if (activeTabId !== 'home') return;
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        dropOverlay.classList.add('hidden');
        dropOverlay.classList.remove('flex');
      }
    });

    window.addEventListener('drop', (e) => {
      if (activeTabId !== 'home') return;
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.add('hidden');
      dropOverlay.classList.remove('flex');
      
      Array.from(e.dataTransfer.files).forEach(file => {
        if (file.name.endsWith('.html')) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            apps.push({ id: generateId(), name: file.name.replace(/\.html$/i, ''), html: ev.target.result, imageUrl: '', createdAt: Date.now() });
            saveData(); renderGrid();
          };
          reader.readAsText(file);
        }
      });
    });

    // インポート・エクスポート
    document.getElementById('btn-export').onclick = () => {
      const blob = new Blob([JSON.stringify(apps, null, 2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `webapp_hub_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    };
    document.getElementById('btn-import').onclick = () => document.getElementById('import-file-input').click();
    document.getElementById('import-file-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!Array.isArray(data)) throw new Error();
          importPendingData = data;
          document.getElementById('import-msg').textContent = `${data.length} 件のデータが見つかりました。`;
          openModal(document.getElementById('import-modal'));
        } catch(e) { alert('不正なファイルです'); }
      };
      reader.readAsText(file);
    };

    document.getElementById('btn-import-append').onclick = () => { apps = [...apps, ...importPendingData]; saveData(); renderGrid(); closeModal(document.getElementById('import-modal')); };
    document.getElementById('btn-import-overwrite').onclick = () => { apps = importPendingData; openAppIds.forEach(id => closeTab(id)); saveData(); renderGrid(); closeModal(document.getElementById('import-modal')); };
    document.getElementById('btn-import-cancel').onclick = () => closeModal(document.getElementById('import-modal'));

    window.onkeydown = (e) => {
      if ((e.key === 'F5' || (e.ctrlKey && e.key === 'r')) && activeTabId !== 'home') {
        e.preventDefault(); reloadActiveApp();
      }
    };

    init();
  </script>
</body>
</html>
