<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebApp Hub</title>
  
  <!-- PWA & App Icons -->
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./favicon.ico">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* アニメーション */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .animate-fade-in { animation: fadeIn 0.15s ease-out forwards; }
    .animate-zoom-in { animation: zoomIn 0.2s ease-out forwards; }
    
    /* スクロールバー */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* アクティブなタブ */
    .tab-active {
      background-color: #f1f5f9;
      color: #4f46e5;
      border-bottom: 2px solid #4f46e5;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* ロゴのホバー効果 */
    .logo-container:hover .logo-icon {
      transform: scale(1.1);
      background-color: #e0e7ff;
    }
  </style>
</head>
<body class="bg-slate-100/50 text-slate-800 font-sans selection:bg-indigo-100 min-h-screen flex flex-col overflow-hidden">

  <!-- ====================
       ヘッダーとタブバー
  ==================== -->
  <header class="bg-white border-b border-slate-200 z-50 shadow-sm shrink-0">
    <div class="max-w-[1800px] mx-auto flex items-center h-14 px-4 gap-4">
      <!-- ロゴ (ホームボタンとして機能) -->
      <div id="logo-home" class="flex items-center gap-2 text-indigo-600 shrink-0 mr-2 cursor-pointer logo-container group transition-all" onclick="switchTab('home')">
        <div class="bg-indigo-100 p-1.5 rounded-lg logo-icon transition-transform duration-200">
          <i data-lucide="box" class="w-5 h-5" stroke-width="2.5"></i>
        </div>
        <h1 class="text-lg font-bold tracking-tight hidden lg:block group-hover:text-indigo-700 transition-colors">WebApp Hub</h1>
      </div>

      <!-- タブコンテナ -->
      <nav id="tab-container" class="flex-1 flex items-center h-full overflow-x-auto no-scrollbar gap-1">
        <!-- JSでタブが挿入されます -->
      </nav>

      <!-- 右側アクション -->
      <div id="global-actions" class="flex items-center gap-1 shrink-0 border-l border-slate-200 pl-4">
        <div id="runner-tools" class="hidden flex items-center gap-1">
          <button id="btn-reload-runner" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500 transition-colors" title="再読み込み (F5)">
            <i data-lucide="rotate-cw" class="w-4 h-4"></i>
          </button>
        </div>
        
        <div id="home-tools" class="flex items-center gap-2">
          <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg px-2">
            <i data-lucide="arrow-up-down" class="w-3.5 h-3.5 text-slate-400 mr-1"></i>
            <select id="sort-select" class="bg-transparent text-xs text-slate-600 py-2 focus:outline-none cursor-pointer">
              <option value="date-asc">登録日 (旧)</option>
              <option value="date-desc">登録日 (新)</option>
              <option value="name-asc">名前 (昇順)</option>
              <option value="name-desc">名前 (降順)</option>
              <option value="custom">手動並び替え</option>
            </select>
          </div>
          <button id="btn-import" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500" title="インポート">
            <i data-lucide="download" class="w-4 h-4"></i>
          </button>
          <button id="btn-export" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500" title="エクスポート">
            <i data-lucide="upload" class="w-4 h-4"></i>
          </button>
          <input type="file" accept=".json" id="import-file-input" class="hidden" />
        </div>

        <!-- 設定ボタン -->
        <button id="btn-settings" class="p-2 hover:bg-slate-100 rounded-lg text-slate-500 ml-1" title="設定">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ====================
       メインコンテンツエリア
  ==================== -->
  <main class="flex-1 relative overflow-hidden bg-slate-50/30">
    
    <!-- グリッド表示（ホーム） -->
    <div id="main-view" class="absolute inset-0 overflow-y-auto p-6 md:p-10 z-10 transition-opacity duration-200">
      <div class="max-w-[1600px] mx-auto">
        <div id="app-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 xl:grid-cols-8 gap-4 sm:gap-6">
          <!-- アプリタイル -->
        </div>
      </div>
    </div>

    <!-- 実行画面（Iframe管理） -->
    <div id="runner-view" class="absolute inset-0 z-20 hidden flex-col bg-white">
      <div id="iframe-manager" class="flex-1 w-full relative">
        <!-- タブごとのiframe -->
      </div>
    </div>
  </main>


  <!-- ====================
       モーダル群
  ==================== -->
  
  <!-- エディタモーダル -->

      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80 shrink-0">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-3">

            <i data-lucide="code" class="w-5 h-5"></i>

      </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 h-full min-h-[400px]">
          <!-- 左カラム: メタデータ -->
          <div class="flex flex-col gap-4">
            <div>

      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80 shrink-0">

            <button id="tab-mode-icon" class="flex-1 py-2 text-sm font-medium rounded-lg transition-all">アイコンのみ</button>

        <hr class="border-slate-100">

          <div class="flex justify-between text-sm">

        </div>

  <!-- 確認・アラートモーダル -->

    <div class="bg-white p-6 rounded-3xl shadow-xl max-w-sm w-full animate-zoom-in">
      <h3 id="confirm-title" class="text-lg font-bold text-slate-800 mb-2"></h3>

    <div class="bg-white p-6 rounded-3xl shadow-xl max-w-sm w-full text-center animate-zoom-in">

  <!-- D&Dオーバーレイ -->

    <i data-lucide="file-code" class="w-20 h-20 mb-4"></i>
    <h2 class="text-3xl font-bold">ファイルをドロップ</h2>
    <p class="mt-2 text-indigo-100 font-medium">複数のHTMLを一気に追加できます</p>
  </div>

  <!-- ====================
       JavaScript ロジック
  ==================== -->
  <script>
    // --- 戻る・進む (ハッシュルーティング) の監視 ---
    window.addEventListener('hashchange', () => {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const tabFromHash = hashParams.get('tab') || 'home';
      
      if (tabFromHash === 'home' || apps.find(a => a.id === tabFromHash)) {
          switchTab(tabFromHash, true);
      } else {
          switchTab('home', true);
      }
    });

    // --- IndexedDB ラッパー (大容量保存用) ---
    const DB_NAME = 'WebAppHubDB';
    const STORE_NAME = 'appsStore';

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          e.target.result.createObjectStore(STORE_NAME);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function idbGet(key) {
      try {
        const db = await openDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const request = store.get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      } catch (e) {
        console.warn("IndexedDB GET error", e);
        return null;
      }
    }

    async function idbSet(key, value) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const request = store.put(value, key);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    // --- 状態管理 ---
    let apps = [];
    let openAppIds = []; 
    let activeTabId = 'home';
    let sortOption = 'date-asc';
    let draggingAppId = null;
    let isInternalAppDrag = false;
    let dropInsertIndex = null;
    let forceEnableSaveAfterRestore = false;
    
    // エディタ状態管理
    let currentEditingAppId = null;
    let currentImageUrl = '';
    let currentCodeType = 'html'; 
    let currentGithubUrl = '';
    
    // 編集中のコードや、登録済みの種類を追跡する
    let editorDraftHtml = '';
    let editorDraftReact = '';
    let originalAppCodeType = null;

    let importPendingData = null;
    let confirmCallback = null;
    
    // 設定
    let tabDisplayMode = 'full'; 

    // --- GitHub 同期共通ロジック ---
    async function syncGithubCode(appId, iconElement = null) {
        const app = apps.find(a => a.id === appId);
        if (!app || !app.githubUrl) return;

        if (iconElement) iconElement.classList.add('animate-spin');

        try {
            // エディタの「取得」と同じ堅牢なURLパース
            let url = app.githubUrl;
            try {
                const urlObj = new URL(url);
                urlObj.search = ''; urlObj.hash = '';
                if (urlObj.hostname === 'github.com') {
                    const parts = urlObj.pathname.split('/');
                    if (parts[3] === 'blob' || parts[3] === 'raw') {
                        parts.splice(3, 1);
                        urlObj.hostname = 'raw.githubusercontent.com';
                        urlObj.pathname = parts.join('/');
                    }
                }
                url = urlObj.toString();
            } catch (e) {}

            let fetchUrl = url;
            try {
                const u = new URL(url);
                u.searchParams.set('_t', Date.now()); // キャッシュ回避
                fetchUrl = u.toString();
            } catch(e) {}

            const response = await fetch(fetchUrl, { cache: 'no-store' });
            if (!response.ok) throw new Error(`HTTPエラー: ${response.status}`);
            const sourceCode = await response.text();

            // エディタの「保存して登録」と同じロジック
            const isReact = url.match(/\.(jsx|tsx|js)$/i) || app.codeType === 'react';
            const saveCodeType = isReact ? 'react' : 'html';
            
            let runnableHtml = sourceCode;
            if (saveCodeType === 'react') {
                try {
                    runnableHtml = generateReactHTML(sourceCode, app.name);
                } catch(e) {
                    runnableHtml = "<!-- React Parse Error -->";
                    console.error('React parse error during sync:', e);
                }
            }

            const updatedApp = { 
                ...app, 
                codeType: saveCodeType, 
                sourceCode: sourceCode, 
                html: runnableHtml
            };

            // 保存して画面に反映
            apps = apps.map(a => a.id === app.id ? updatedApp : a);
            await saveData();

            const iframe = document.getElementById(`iframe-${app.id}`);
            if (iframe) iframe.srcdoc = injectStorageShim(app.id, runnableHtml);

            renderGrid();
            showAlert('GitHubから最新のコードに同期しました！');

            // もし編集画面を開いたまま同期した場合、エディタ上の表示も更新する
            if (currentEditingAppId === app.id && !document.getElementById('editor-modal').classList.contains('hidden')) {
                openEditor(updatedApp);
            }

        } catch(err) {
            console.error(err);
            showAlert('同期に失敗しました。\n' + err.message);
        } finally {
            if (iconElement) iconElement.classList.remove('animate-spin');
        }
        updateSaveButtonsState();
    }

    // --- タブ・Iframe管理 ---
    function switchTab(id, skipHistory = false) {
      if (id !== 'home' && !openAppIds.includes(id)) {
        const app = apps.find(a => a.id === id);
        if (!app) {
            id = 'home'; // 万が一IDが存在しない場合はホームへフォールバック
        } else {
            openAppIds.push(id);
            const iframe = document.createElement('iframe');

            iframe.sandbox = "allow-scripts allow-forms allow-modals allow-downloads allow-same-origin allow-popups allow-popups-to-escape-sandbox";
            iframe.srcdoc = injectStorageShim(id, app.html);
            iframeManager.appendChild(iframe);
        }
      }

      // 履歴を追加（同一タブへの連続クリック時は追加しない）
      if (!skipHistory && activeTabId !== id) {
          try {
              window.location.hash = id === 'home' ? '' : 'tab=' + id;
          } catch (e) {
              console.warn('Hash routing is restricted in this environment', e);
          }
      }

      activeTabId = id;

      updateView();

    function injectStorageShim(appId, html) {
      const shim = `<script>
        (function() {
          const appId = "${appId}";
          const prefix = "webapp_hub_scoped_" + appId + "_";
          const originalLS = window.localStorage;
          const scopedLS = {
            getItem: (key) => originalLS.getItem(prefix + key),
            setItem: (key, val) => originalLS.setItem(prefix + key, val),
            removeItem: (key) => originalLS.removeItem(prefix + key),
            clear: () => { Object.keys(originalLS).forEach(k => { if(k.startsWith(prefix)) originalLS.removeItem(k); }); },
            key: (i) => {
              const keys = Object.keys(originalLS).filter(k => k.startsWith(prefix));
              return keys[i] ? keys[i].replace(prefix, '') : null;
            },
            get length() { return Object.keys(originalLS).filter(k => k.startsWith(prefix)).length; }
          };
          Object.defineProperty(window, 'localStorage', { get: () => scopedLS, configurable: true });
        })();
      <\/script>`;
      
      if (html.includes('<head>')) {
        return html.replace('<head>', '<head>\n' + shim);
      }
      return shim + '\n' + html;
    }

    // --- React to HTML 変換エンジン ---
    function parseLucideIcons(source) {
        const iconMap = [];
        const lucideImportRegex = /import\s+{([\s\S]+?)}\s+from\s+['"]lucide-react['"]/g;
        let match;
        while ((match = lucideImportRegex.exec(source)) !== null) {
            const parts = match[1].split(',');
            parts.forEach(part => {
                const cleanPart = part.trim();
                if (!cleanPart) return;
                
                if (cleanPart.includes(' as ')) {
                    const [original, alias] = cleanPart.split(/\s+as\s+/);
                    iconMap.push({ original: original.trim(), alias: alias.trim() });
                } else {
                    iconMap.push({ original: cleanPart, alias: cleanPart });
                }
            });
        }
        return iconMap;
    }

    function generateReactHTML(source, appName) {
        const iconMap = parseLucideIcons(source);
        const iconShims = iconMap.map(icon => 
            `const ${icon.alias} = (props) => <Icon name="${icon.original}" {...props} />;`
        ).join('\n        ');

        let processedCode = source.replace(/import\s+[\s\S]*?from\s+['"].*?['"];?/g, '');
        
        let mainComponentName = "App";
        const exportMatch = source.match(/export\s+default\s+(?:function\s+([A-Za-z0-9_]+)|([A-Za-z0-9_]+))/);
        if (exportMatch) {
            mainComponentName = exportMatch[1] || exportMatch[2];
        }

        processedCode = processedCode.replace(/export\s+default\s+function/g, 'function');
        processedCode = processedCode.replace(/export\s+default\s+/g, `const ${mainComponentName} = `);

        return `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>${escapeHTML(appName)}</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
    <script src="https://unpkg.com/lucide@latest"><\/script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        * { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        const Icon = ({ name, size = 24, strokeWidth = 2, className = "", color = "currentColor", ...props }) => {
            const [svgContent, setSvgContent] = useState("");
            
            useEffect(() => {
                if (window.lucide) {
                    const kebabName = name
                        .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
                        .replace(/([a-zA-Z])([0-9])/g, '$1-$2')
                        .toLowerCase();
                    const temp = document.createElement('div');
                    temp.innerHTML = '<i data-lucide="' + kebabName + '"></i>';
                    window.lucide.createIcons({ root: temp });
                    const svgNode = temp.querySelector('svg');
                    if (svgNode) {
                        setSvgContent(svgNode.innerHTML);
                    }
                }
            }, [name]);

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke={color} 
                    strokeWidth={strokeWidth} 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className} 
                    {...props}
                    dangerouslySetInnerHTML={{ __html: svgContent }}
                />
            );
        };

        ${iconShims}

        ${processedCode}

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<${mainComponentName} />);
    <\/script>
</body>
</html>`;
    }

    // --- エディタ関連ロジック ---
    function setCodeTypeUI(type) {
        // 現在の入力を下書きに保存する

    // GitHubからのコード取得・更新
    document.getElementById('btn-fetch-github').onclick = async () => {
      // 新規取得の場合の処理
      const urlInput = document.getElementById('github-url-input');
      let url = urlInput.value.trim();
      if (!url) {
        showAlert('GitHubのファイルURLを入力してください。');
        return;
      }

      // GitHubの通常URLをRaw URLに変換 (より堅牢なパース)
      try {
        const urlObj = new URL(url);
        
        // GitHubのUIからコピーした際につきやすい不要なパラメータや行数指定(#)を削除
        urlObj.search = '';
        urlObj.hash = '';

        if (urlObj.hostname === 'github.com') {
          const parts = urlObj.pathname.split('/');
          // parts構造: ["", "ユーザー名", "リポジトリ", "blob"(または"raw"), "ブランチ名", ...]
          if (parts[3] === 'blob' || parts[3] === 'raw') {
            parts.splice(3, 1); // "blob" または "raw" の部分を削除
            urlObj.hostname = 'raw.githubusercontent.com';
            urlObj.pathname = parts.join('/');
          }
        }
        url = urlObj.toString();
      } catch (e) {
        // URLとして正しくない場合は無視（後のFetchでエラーハンドリングさせる）
      }

      const btn = document.getElementById('btn-fetch-github');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>';
      btn.disabled = true;

      try {
        // キャッシュ回避のためにタイムスタンプを付与
        let fetchUrl = url;
        try {
            const u = new URL(url);
            u.searchParams.set('_t', Date.now());
            fetchUrl = u.toString();
        } catch(e) {}

        const response = await fetch(fetchUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTPエラー: ${response.status}`);
        const text = await response.text();

        // 拡張子からコードのタイプを推測
        const originalUrl = urlInput.value.trim();
        const isReact = url.match(/\.(jsx|tsx|js)$/i);
        currentGithubUrl = originalUrl;
        originalAppCodeType = isReact ? 'react' : 'html';

        if (isReact) {
            editorDraftReact = text;
            try {
                editorDraftHtml = generateReactHTML(text, nameInput.value.trim() || 'App');
            } catch(e) {
                editorDraftHtml = "<!-- React Parse Error -->";
            }
        } else {
            editorDraftHtml = text;
            editorDraftReact = '';
        }

        setCodeTypeUI(originalAppCodeType);
        
        // アプリ名が空ならファイル名から自動設定
        if (!nameInput.value.trim()) {
          let fileName = originalUrl.split('/').pop().split('.')[0];
          if(fileName.includes('?')) fileName = fileName.split('?')[0];
          if(fileName.includes('#')) fileName = fileName.split('#')[0];
          nameInput.value = fileName.charAt(0).toUpperCase() + fileName.slice(1);
        }

        urlInput.readOnly = true;
        urlInput.classList.add('bg-slate-100', 'text-slate-500');
        btn.innerHTML = '<i data-lucide="refresh-cw" class="w-4 h-4"></i>更新';
        updateSaveButtonsState();

        showAlert('GitHubから最新のソースコードを取得しました！');
      } catch (err) {
        console.error(err);
        showAlert('ファイルの取得に失敗しました。\nURLが正しいか、公開リポジトリであるか確認してください。\n\n詳細: ' + err.message);
        btn.innerHTML = originalText;
      } finally {
        btn.disabled = false;
        lucide.createIcons({ root: btn.parentElement });
      }
    };

    
    async function saveEditorApp(saveHistory = false, forceWithoutChanges = false, historyComment = '', forceHtmlSave = false) {
      // 登録時の状態を更新する
      if (forceHtmlSave) {
          editorDraftHtml = htmlInput.value;
      } else if (currentCodeType === 'html' && originalAppCodeType !== 'react' && !currentGithubUrl) {
          editorDraftHtml = htmlInput.value;
      } else if (currentCodeType === 'react' && !currentGithubUrl) {
          editorDraftReact = htmlInput.value;
      }

      const name = nameInput.value.trim();
      const saveCodeType = forceHtmlSave ? 'html' : ((originalAppCodeType === 'react') ? 'react' : currentCodeType);
      const sourceCode = (saveCodeType === 'react') ? editorDraftReact.trim() : editorDraftHtml.trim();

      if (!name || !sourceCode) return;

      const hasChanges = forceHtmlSave ? true : hasEditorChanges();
      if (!hasChanges && !saveHistory) return;
      if (!hasChanges && saveHistory && !forceWithoutChanges) {
        document.getElementById('confirm-title').textContent = '変更なしで履歴を保存';
        document.getElementById('confirm-msg').textContent = 'コードに変化がありません。履歴だけを残しますか？';
        confirmCallback = async () => saveEditorApp(true, true, historyComment);
        openModal(document.getElementById('confirm-modal'));
        return;
      }

      const saveBtn = document.getElementById('btn-save-editor');
      const saveBtnHistory = document.getElementById('btn-save-editor-with-history');
      const saveText = document.getElementById('save-editor-text');
      const saveLoader = document.getElementById('save-editor-loader');
      
      saveBtn.disabled = true;
      saveBtnHistory.disabled = true;
      saveText.textContent = "変換・保存中...";
      saveLoader.classList.remove('hidden');

      setTimeout(async () => {
        try {
            let runnableHtml = sourceCode;
            
            if (saveCodeType === 'react') {
                runnableHtml = generateReactHTML(sourceCode, name);
            }

            let newApps = [...apps];

            if (currentEditingAppId) {
              const app = newApps.find(a => a.id === currentEditingAppId);
              let newHistory = app.history || [];
            if (saveHistory) {
                const historyItem = { timestamp: Date.now(), name, codeType: saveCodeType, sourceCode, imageUrl: currentImageUrl, comment: historyComment };
                newHistory = [...newHistory, historyItem].slice(-10);
              }

              newApps = newApps.map(a => a.id === currentEditingAppId ? { 
                ...a, name, codeType: saveCodeType, sourceCode, html: runnableHtml, imageUrl: currentImageUrl, history: newHistory, githubUrl: currentGithubUrl 
              } : a);
              
            } else {
              const newApp = { id: generateId(), name, codeType: saveCodeType, sourceCode, html: runnableHtml, imageUrl: currentImageUrl, createdAt: Date.now(), history: [], githubUrl: currentGithubUrl };
              if (saveHistory) {
                newApp.history = [{ timestamp: Date.now(), name, codeType: saveCodeType, sourceCode, imageUrl: currentImageUrl, comment: historyComment }];
              }
              newApps.push(newApp);
            }
            
            apps = newApps;
            await saveData();

            if (currentEditingAppId) {
                const iframe = document.getElementById(`iframe-${currentEditingAppId}`);
                if (iframe) iframe.srcdoc = injectStorageShim(currentEditingAppId, runnableHtml);
            }

            renderGrid();
            closeModal(editorModal);
            forceEnableSaveAfterRestore = false;

        } catch (err) {
            console.error(err);
            showAlert('【変換・保存エラー】\n' + err.message + '\n\nReactの構文が正しいか確認してください。');
        } finally {
            saveBtn.disabled = false;
            saveBtnHistory.disabled = false;
            saveText.textContent = "保存して登録";
            saveLoader.classList.add('hidden');
        }
      }, 50);
    }

    function processImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const max = 200;
          let w = img.width, h = img.height;
          if (w > h) { if (w > max) { h *= max/w; w = max; } } else { if (h > max) { w *= max/h; h = max; } }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          currentImageUrl = canvas.toDataURL('image/webp', 0.8);
          urlInput.value = "添付画像 (リサイズ済)";
          updateImagePreviewUI();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    document.getElementById('editor-image-file').onchange = (e) => { if(e.target.files[0]) processImage(e.target.files[0]); };
    document.getElementById('btn-clear-image').onclick = () => { currentImageUrl = ''; urlInput.value = ''; updateImagePreviewUI(); };
    urlInput.oninput = (e) => { currentImageUrl = e.target.value; updateImagePreviewUI(); };
    editorModal.onpaste = (e) => {
      const item = Array.from(e.clipboardData.items).find(i => i.type.startsWith('image/'));
      if (item) { processImage(item.getAsFile()); e.preventDefault(); }
    };

    }
    document.getElementById('btn-confirm-ok').onclick = () => { confirmCallback?.(); closeModal(document.getElementById('confirm-modal')); };
    document.getElementById('btn-confirm-cancel').onclick = () => closeModal(document.getElementById('confirm-modal'));

    // ドラッグ＆ドロップ
    const dropOverlay = document.getElementById('drop-overlay');
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      if (activeTabId !== 'home') return; 
      if (isInternalAppDrag) return;
      e.preventDefault();
      if (e.dataTransfer.types.includes('Files')) {
        dragCounter++;
        dropOverlay.classList.remove('hidden');
        dropOverlay.classList.add('flex');
      }
    });

    window.addEventListener('dragover', (e) => {
      if (activeTabId !== 'home') return;
      if (isInternalAppDrag) return;
      e.preventDefault();
    });

    window.addEventListener('dragleave', (e) => {
      if (activeTabId !== 'home') return;
      if (isInternalAppDrag) return;
      e.preventDefault();
      dragCounter--;
      if (dragCounter === 0) {
        dropOverlay.classList.add('hidden');
        dropOverlay.classList.remove('flex');
      }
    });

    window.addEventListener('drop', (e) => {
      if (activeTabId !== 'home') return;
      if (isInternalAppDrag) return;
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.add('hidden');
      dropOverlay.classList.remove('flex');
      
      Array.from(e.dataTransfer.files).forEach(file => {
        if (file.name.endsWith('.html')) {
          const reader = new FileReader();
          reader.onload = async (ev) => {
            apps.push({ id: generateId(), name: file.name.replace(/\.html$/i, ''), codeType: 'html', sourceCode: ev.target.result, html: ev.target.result, imageUrl: '', createdAt: Date.now() });
            await saveData(); renderGrid();
          };
          reader.readAsText(file);
        }
      });
    });

    // インポート・エクスポート
    function updateExportSelectedCount() {
      const checked = document.querySelectorAll('.export-app-checkbox:checked').length;
      document.getElementById('export-selected-count').textContent = `${checked}件選択中`;
    }

    function openExportModal() {
      const list = document.getElementById('export-app-list');
      const selectAll = document.getElementById('export-select-all');
      list.innerHTML = '';

      apps.forEach(app => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'export-thumb relative text-left rounded-xl border-2 border-indigo-400 bg-white p-2 shadow-sm hover:shadow transition-all';
        const icon = app.imageUrl
          ? `<img src="${escapeHTML(app.imageUrl)}" class="w-10 h-10 rounded-lg object-cover" />`
          : `<div class="w-10 h-10 rounded-lg bg-gradient-to-br ${getColorFromName(app.name)} text-white flex items-center justify-center text-xs font-bold">${escapeHTML(app.name.substring(0, 2).toUpperCase())}</div>`;
        card.innerHTML = `
          <input type="checkbox" class="export-app-checkbox hidden" value="${app.id}" checked>
          <div class="absolute top-1 right-1 w-5 h-5 rounded-full bg-indigo-600 text-white text-[10px] flex items-center justify-center">✓</div>
          <div class="flex items-center gap-2">
            ${icon}
            <span class="text-xs text-slate-700 truncate">${escapeHTML(app.name)}</span>
          </div>
        `;
        card.onclick = () => {
          const cb = card.querySelector('.export-app-checkbox');
          cb.checked = !cb.checked;
          card.classList.toggle('border-indigo-400', cb.checked);
          card.classList.toggle('bg-white', cb.checked);
          card.classList.toggle('border-slate-200', !cb.checked);
          card.classList.toggle('bg-slate-100', !cb.checked);
          card.querySelector('.absolute').classList.toggle('hidden', !cb.checked);
          const all = list.querySelectorAll('.export-app-checkbox');
          const checked = list.querySelectorAll('.export-app-checkbox:checked');
          selectAll.checked = all.length > 0 && all.length === checked.length;
          updateExportSelectedCount();
        };
        list.appendChild(card);
      });

      selectAll.checked = true;
      updateExportSelectedCount();

      openModal(document.getElementById('export-modal'));
    }

    document.getElementById('btn-export').onclick = () => {
      if (apps.length === 0) {
        showAlert('エクスポートできるアプリがありません。');
        return;
      }
      openExportModal();
    };
    document.getElementById('export-select-all').onchange = (e) => {
      document.querySelectorAll('.export-thumb').forEach(card => {
        const cb = card.querySelector('.export-app-checkbox');
        cb.checked = e.target.checked;
        card.classList.toggle('border-indigo-400', cb.checked);
        card.classList.toggle('bg-white', cb.checked);
        card.classList.toggle('border-slate-200', !cb.checked);
        card.classList.toggle('bg-slate-100', !cb.checked);
        card.querySelector('.absolute').classList.toggle('hidden', !cb.checked);
      });
      updateExportSelectedCount();
    };
    document.getElementById('btn-export-cancel').onclick = () => closeModal(document.getElementById('export-modal'));
    document.getElementById('btn-export-confirm').onclick = () => {
      const selectedIds = Array.from(document.querySelectorAll('.export-app-checkbox:checked')).map(cb => cb.value);
      const selectedApps = apps.filter(app => selectedIds.includes(app.id));
      if (selectedApps.length === 0) {
        showAlert('エクスポートするアプリを1つ以上選択してください。');
        return;
      }
      const blob = new Blob([JSON.stringify(selectedApps, null, 2)], {type: 'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `webapp_hub_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      closeModal(document.getElementById('export-modal'));
    };
    document.getElementById('btn-import').onclick = () => document.getElementById('import-file-input').click();
    document.getElementById('import-file-input').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!Array.isArray(data)) throw new Error();
          
          importPendingData = data.map(app => ({
              ...app,
              codeType: app.codeType || 'html',
              sourceCode: app.sourceCode !== undefined ? app.sourceCode : app.html,
              history: app.history || [],
              githubUrl: app.githubUrl || ''
          }));

          document.getElementById('import-msg').textContent = `${data.length} 件のデータが見つかりました。`;
          openModal(document.getElementById('import-modal'));
        } catch(e) { showAlert('不正なファイルです。JSON形式であるか確認してください。'); }
      };
      reader.readAsText(file);
      e.target.value = ''; // 連続で同じファイルをインポートできるようにリセット
    };

    document.getElementById('btn-import-append').onclick = async () => { apps = [...apps, ...importPendingData]; await saveData(); renderGrid(); closeModal(document.getElementById('import-modal')); };
    document.getElementById('btn-import-overwrite').onclick = async () => { apps = importPendingData; [...openAppIds].forEach(id => closeTab(id)); await saveData(); renderGrid(); closeModal(document.getElementById('import-modal')); };
    document.getElementById('btn-import-cancel').onclick = () => closeModal(document.getElementById('import-modal'));

    window.onkeydown = (e) => {
      if ((e.key === 'F5' || (e.ctrlKey && e.key === 'r')) && activeTabId !== 'home') {
        e.preventDefault(); reloadActiveApp();
      }
    };

    init();
  </script>
</body>
</html>
