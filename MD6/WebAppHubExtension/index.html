<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebApp Hub</title>
<link rel="stylesheet" href="hub.css">
<script src="hub.js" type="module"></script>
<body>
  <header class="top">
    <a href="index.html" class="brand"><span aria-hidden="true">▦</span> WebApp Hub</a>
    <button id="settings">設定</button>
  </header>
  <main>
    <div class="heading">
      <h1>スピードダイヤル</h1>
      <button id="add" class="primary">＋ 追加</button>
    </div>
    <div id="entries"></div>
    <p id="status" role="status"></p>
  </main>
  <dialog id="editor">
    <form id="entry-form">
      <h2 id="editor-title">項目を追加</h2>
      <label>種類<select id="kind"><option value="site">Web サイト</option><option value="html">HTML アプリ</option><option value="react">JSX アプリ</option></select></label>
      <label>名前<input id="name" placeholder="例：メモ帳"></label>
      <label id="url-field">URL<input id="url" type="url" placeholder="https://example.com/"></label>
      <div id="code-fields" hidden>
        <label>ファイルを選択<input id="file" type="file" accept=".html,.htm,.jsx,.js"></label>
        <label>ソースコード<textarea id="source" rows="9" spellcheck="false"></textarea></label>
      </div>
      <p id="editor-error" role="alert"></p>
      <footer>
        <button type="button" id="delete" class="danger" hidden>削除</button>
        <button type="button" id="cancel-edit">キャンセル</button>
        <button class="primary">保存</button>
      </footer>
    </form>
  </dialog>
  <dialog id="preferences">
    <h2>設定</h2>
    <label>リンクとアプリを開く場所
      <select id="open-mode">
        <option value="same">同じブラウザータブ</option>
        <option value="new">新しいブラウザータブ</option>
      </select>
    </label>
    <h3>Chrome の起動時に表示</h3>
    <p>Chrome の設定 → 起動時 → 「新しいタブページを開く」を選びます。特定のページとして設定する場合は、下のアドレスを貼り付けます。</p>
    <label>起動ページのアドレス<input id="startup-url" readonly></label>
    <button id="copy-startup">アドレスをコピー</button>
    <h3>バックアップ</h3>
    <button id="export">書き出す</button>
    <label>WebApp Hub・Speed Dial 2 のバックアップを読み込む<input id="import" type="file" accept=".json,application/json"></label>
    <p id="settings-status" role="status"></p>
    <form method="dialog"><footer><button>閉じる</button></footer></form>
  </dialog>
</body>
</html>
