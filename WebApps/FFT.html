<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced React to HTML Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: 700; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col text-slate-900">

    <!-- Header -->
    <header class="bg-white/70 backdrop-blur-md border-b sticky top-0 z-50 px-8 py-3 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <div class="bg-blue-600 p-2.5 rounded-2xl shadow-lg shadow-blue-200">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-black text-slate-800 tracking-tight">React FULL REPRODUCER</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-tighter">Complex Logic & Lucide Support</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button id="btnConvert" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2.5 rounded-xl font-bold transition-all shadow-lg active:scale-95 flex items-center gap-2">
                <span>HTMLに変換・再現</span>
            </button>
            <button id="btnDownload" class="bg-slate-800 hover:bg-slate-900 text-white px-6 py-2.5 rounded-xl font-bold transition-all shadow-lg hidden flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                <span>保存</span>
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Input Section -->
        <div class="w-1/2 flex flex-col bg-white border-r relative">
            <div class="px-6 py-2 bg-slate-50 border-b flex justify-between items-center shrink-0">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Source Code (JSX)</span>
                <button id="btnClear" class="text-[10px] font-bold text-slate-400 hover:text-red-500 transition uppercase">Clear All</button>
            </div>
            <textarea id="inputCode" class="flex-1 p-6 code-font text-[13px] outline-none resize-none leading-relaxed text-slate-700 scrollbar-hide" placeholder="// 複雑なインポートを含むReactコードをここに貼り付け..."></textarea>
        </div>

        <!-- Output/Preview Section -->
        <div class="w-1/2 flex flex-col overflow-hidden bg-slate-50">
            <div class="flex border-b bg-white shrink-0">
                <button id="tabPreview" class="flex-1 py-4 text-xs font-black tracking-widest uppercase tab-active">Live Preview</button>
                <button id="tabCode" class="flex-1 py-4 text-xs font-black tracking-widest uppercase text-slate-400 border-b-3 border-transparent">Generated HTML</button>
            </div>

            <!-- Preview Window -->
            <div id="containerPreview" class="flex-1 p-6 overflow-hidden flex flex-col">
                <div class="flex-1 bg-white border rounded-2xl shadow-2xl overflow-hidden relative">
                    <iframe id="previewFrame" class="w-full h-full border-none"></iframe>
                    <div id="loadingOverlay" class="absolute inset-0 bg-white/90 flex items-center justify-center hidden z-50">
                        <div class="flex flex-col items-center gap-4">
                            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                            <span class="text-sm font-black text-slate-800 tracking-widest uppercase">Analyzing & Building...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- HTML Code View -->
            <div id="containerCode" class="flex-1 p-6 hidden flex flex-col bg-slate-900">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Standalone index.html</span>
                    <button id="btnCopy" class="text-[10px] font-bold text-blue-400 hover:text-blue-300 transition uppercase">Copy to Clipboard</button>
                </div>
                <textarea id="outputHtml" readonly class="flex-1 p-6 code-font text-[12px] bg-slate-800 text-blue-200 rounded-2xl outline-none resize-none border border-slate-700 leading-normal scrollbar-hide"></textarea>
            </div>
        </div>
    </main>

    <!-- Global Toast -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 px-10 py-4 rounded-3xl bg-slate-900 text-white text-xs font-black shadow-2xl transition-all opacity-0 translate-y-10 pointer-events-none z-[100] tracking-widest uppercase"></div>

    <script>
        const inputCode = document.getElementById('inputCode');
        const outputHtml = document.getElementById('outputHtml');
        const previewFrame = document.getElementById('previewFrame');
        const btnConvert = document.getElementById('btnConvert');
        const btnDownload = document.getElementById('btnDownload');
        const btnCopy = document.getElementById('btnCopy');
        const btnClear = document.getElementById('btnClear');
        const toast = document.getElementById('toast');
        const loadingOverlay = document.getElementById('loadingOverlay');

        const tabPreview = document.getElementById('tabPreview');
        const tabCode = document.getElementById('tabCode');
        const containerPreview = document.getElementById('containerPreview');
        const containerCode = document.getElementById('containerCode');

        // --- Tab Switch Logic ---
        function switchTab(activeTab, inactiveTab, showContainer, hideContainer) {
            activeTab.className = "flex-1 py-4 text-xs font-black tracking-widest uppercase tab-active";
            inactiveTab.className = "flex-1 py-4 text-xs font-black tracking-widest uppercase text-slate-400 border-b-3 border-transparent";
            showContainer.classList.remove('hidden');
            hideContainer.classList.add('hidden');
        }

        tabPreview.onclick = () => switchTab(tabPreview, tabCode, containerPreview, containerCode);
        tabCode.onclick = () => switchTab(tabCode, tabPreview, containerCode, containerPreview);

        function showToast(text) {
            toast.innerText = text;
            toast.classList.remove('opacity-0', 'translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        // --- Logic: Parse Lucide Imports (Supports Aliases like { Image as ImageIcon }) ---
        function parseLucideIcons(source) {
            const iconMap = [];
            // Regex for matching the curly brace content of lucide-react imports
            // Example: import { FolderOpen, Image as ImageIcon } from 'lucide-react';
            const lucideImportRegex = /import\s+{([\s\S]+?)}\s+from\s+['"]lucide-react['"]/g;
            let match;
            while ((match = lucideImportRegex.exec(source)) !== null) {
                const parts = match[1].split(',');
                parts.forEach(part => {
                    const cleanPart = part.trim();
                    if (!cleanPart) return;
                    
                    if (cleanPart.includes(' as ')) {
                        const [original, alias] = cleanPart.split(/\s+as\s+/);
                        iconMap.push({ original: original.trim(), alias: alias.trim() });
                    } else {
                        iconMap.push({ original: cleanPart, alias: cleanPart });
                    }
                });
            }
            return iconMap;
        }

        // --- Logic: Build the Final Standalone HTML ---
        function generateHTML(source) {
            // 1. Extract icons with alias support
            const iconMap = parseLucideIcons(source);
            const iconShims = iconMap.map(icon => 
                `const ${icon.alias} = (props) => <Icon name="${icon.original}" {...props} />;`
            ).join('\n        ');

            // 2. Remove all import statements
            let processedCode = source.replace(/import\s+[\s\S]*?from\s+['"].*?['"];?/g, '');
            
            // 3. Detect main component (default export)
            let mainComponentName = "App";
            const exportMatch = source.match(/export\s+default\s+(?:function\s+([A-Za-z0-9_]+)|([A-Za-z0-9_]+))/);
            if (exportMatch) {
                mainComponentName = exportMatch[1] || exportMatch[2];
            }

            // 4. Clean exports to make them valid in a browser script
            processedCode = processedCode.replace(/export\s+default\s+function/g, 'function');
            processedCode = processedCode.replace(/export\s+default\s+/g, `const ${mainComponentName} = `);

            // 5. Wrap everything in a single-file template
            return `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reproduced React App</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>
    <script src="https://unpkg.com/lucide@latest"><\/script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        * { -webkit-tap-highlight-color: transparent; }
        /* Hide scrollbars for a cleaner UI in the reproduced app */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        /**
         * System Hooks & Helpers
         */
        const { useState, useRef, useEffect, useCallback, useMemo } = React;

        /**
         * Lucide Icon Wrapper
         * Handles mapping React-style names to the browser bundle's kebab-case naming.
         */
        const Icon = ({ name, size = 24, strokeWidth = 2, className = "", color = "currentColor", ...props }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide && iconRef.current) {
                    const kebabName = name
                        .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
                        .replace(/([a-zA-Z])([0-9])/g, '$1-$2')
                        .toLowerCase();
                    iconRef.current.innerHTML = '<i data-lucide="' + kebabName + '"></i>';
                    window.lucide.createIcons({
                        attrs: { 
                            width: size, 
                            height: size, 
                            "stroke-width": strokeWidth, 
                            stroke: color,
                            class: className 
                        },
                        nameAttr: 'data-lucide'
                    });
                }
            }, [name, size, strokeWidth, className, color]);
            return <span ref={iconRef} className={"inline-flex items-center justify-center " + className} {...props}></span>;
        };

        /**
         * Lucide Icon Shims (Generated from imports)
         */
        ${iconShims}

        /**
         * --- User Original Code Section ---
         */
        ${processedCode}
        /**
         * --- End of User Original Code ---
         */

        /**
         * Entry Point
         */
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<${mainComponentName} />);
    <\/script>
</body>
</html>`;
        }

        // --- App Interactions ---
        btnConvert.onclick = () => {
            const rawSource = inputCode.value.trim();
            if (!rawSource) {
                showToast("Please paste some React code first.");
                return;
            }

            loadingOverlay.classList.remove('hidden');
            
            setTimeout(() => {
                try {
                    const finalHtml = generateHTML(rawSource);
                    outputHtml.value = finalHtml;

                    // Update Iframe with Blob for better stability with large files
                    const blob = new Blob([finalHtml], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    previewFrame.src = url;

                    btnDownload.classList.remove('hidden');
                    showToast("Code successfully reproduced!");
                    
                    // Force switch to preview
                    tabPreview.click();
                } catch (err) {
                    console.error("Conversion Error:", err);
                    showToast("Error parsing the code. Check console.");
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            }, 800);
        };

        btnDownload.onclick = () => {
            if (!outputHtml.value) return;
            const blob = new Blob([outputHtml.value], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "reproduced_app.html";
            a.click();
            showToast("HTML file saved.");
        };

        btnCopy.onclick = () => {
            outputHtml.select();
            document.execCommand('copy');
            showToast("Copied to clipboard.");
        };

        btnClear.onclick = () => {
            inputCode.value = "";
            outputHtml.value = "";
            previewFrame.src = "about:blank";
            btnDownload.classList.add('hidden');
            showToast("Cleared.");
        };
    </script>
</body>
</html>
